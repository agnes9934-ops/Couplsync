name: 앱 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip 풀기
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            unzip -oq "$z" -d /tmp/x
            cp -r /tmp/x/coupang-sync/. .
            git rm -q "$z"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -qm "zip 풀기"
            git push
            break
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 앱 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: 다운로드 링크 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk couplsync.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app couplsync.apk --title "쿠플 싱크 앱" --notes "최신 버전"
